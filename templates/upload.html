{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Upload Chest X-ray (JPG/PNG/DICOM ≤ 10 MB)</h2>
  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}
  <form action="{{ url_for('predict_form') }}" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button type="submit">Analyze</button>
  </form>
  <p class="hint">We de-identify DICOM before processing.</p>
</section>
{% endblock %}
